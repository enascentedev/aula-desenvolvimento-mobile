# Memoria do daemon do Gradle.
# A maquina tem 8 GB de RAM no total, entao 1536m evita competir com o VS Code
# e com o WSL. Se a build falhar por falta de memoria, suba para 2048m.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Compila os modulos em paralelo e reaproveita saidas entre builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Obrigatorio para bibliotecas AndroidX (Compose depende disso).
android.useAndroidX=true

kotlin.code.style=official
